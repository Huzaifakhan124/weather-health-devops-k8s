<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health & Weather Cloud Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🌤️ Cloud Weather & Health Hub </h1>
        <p>Live DevOps Deployment Demo check </p>
        
        <div class="card">
            <h3>Today's Weather</h3>
            <p>Islamabad: <strong id="temp">28°C</strong> | Sunny ☀️</p>
        </div>

        <div class="card">
            <h3>Daily Health Tip</h3>
            <p id="health-tip">Stay hydrated! Drink at least 3 liters of water and take a 30-minute brisk walk today. 💧</p>
        </div>

        <div class="status" id="status-text">System Status: Operational & Healthy 🚀</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
