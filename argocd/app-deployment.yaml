apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weather-health-app
  namespace: argocd
spec:
  project: new-one
  source:
    repoURL: 'https://github.com/Huzaifakhan124/weather-health-devops-project.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: weather-space
  syncPolicy:
    automated:
      prune: true
      selfHeal: true